[package]
name = "capsule_app"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = "0.27.2"
egui = "0.27.2"
# # For image support:
# egui_extras = { workspace = true, features = ["default", "image"] }
egui_dock = "0.12"
egui_extras = { version = "0.27.2", features = ["default", "image"] }
env_logger = { version = "0.11.3", default-features = false, features = [
    "auto-color",
    "humantime",
] }
geo = "0.29.3"
itertools = "0.14.0"
meansd = "2.1.0"
nalgebra = { version = "0.33.2", features = ["rand"] }
parking_lot = "0.12.3"
rand = "0.9.0"
rand_distr = "0.5.1"
rapier2d = "0.23.1"
rayon = "1.10.0"

[profile.release]
strip = "debuginfo"
opt-level = 3
lto = true
codegen-units = 1
